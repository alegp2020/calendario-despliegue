services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://alexandra_user:password123@db-test:5432/calendario_test_db
    depends_on:
      - db-test

  db-test:
    image: postgres:15-alpine
    container_name: calendario-postgres-test
    restart: always
    environment:
      POSTGRES_USER: alexandra_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: calendario_test_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
